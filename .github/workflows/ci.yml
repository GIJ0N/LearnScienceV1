name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test adaptive tutoring cycle and durable decisions
        run: |
          node tests/adaptive_cycle.test.js
          python tests/adaptive_cycle.test.py

      - name: Run evidence policy tests
        run: node tests/evidence_policy.test.js

      - name: Test read-only evidence map
        run: |
          node tests/evidence_map.test.js
          python tests/visual_demo_seed.test.py

      - name: Run evidence sufficiency and confirmation flow tests
        run: node tests/evidence_sufficiency.test.js

      - name: Run active confirmation endpoint and persistence tests
        run: python tests/evidence_confirmation.test.py

      - name: Test evidence-aware lesson adaptation
        run: python tests/adaptive_lesson.test.py

      - name: Run reachable dimension integration tests
        run: python tests/reachable_dimensions.test.py

      - name: Run delayed review frontend tests
        run: node tests/delayed_review.test.js

      - name: Run delayed review backend contract tests
        run: python tests/delayed_review_backend.test.py

      - name: Run durable memory tests
        run: python tests/durable_memory.test.py

      - name: Run durable frontend tests
        run: node tests/durable_memory_frontend.test.js

      - name: Run microtutoring repair episode tests
        run: node tests/microtutoring_repair_episode.test.js

      - name: Run repair teaching frontend tests
        run: node tests/repair_teaching_v2.test.js

      - name: Run repair teaching backend tests
        run: python tests/repair_teaching_backend.test.py

      - name: Run repair diagnosis recovery tests
        run: |
          node tests/repair_diagnosis_recovery.test.js
          python tests/repair_diagnosis_recovery_backend.test.py

      - name: Run criterion assessment v1 tests
        run: |
          python tests/criterion_assessment.test.py
          python tests/criterion_durability.test.py
          python tests/criterion_server_lock.test.py
          node tests/criterion_assessment_frontend.test.js

      - name: Run controlled repair acceptance tests
        run: |
          node tests/repair_acceptance_controlled.test.js
          python tests/repair_persistence_acceptance.test.py

      - name: Check app.js syntax
        run: node --check app.js

      - name: Run the legacy app self-test
        run: python app_legacy.py --self-test

      - name: Compile the legacy app
        run: python -m py_compile app_legacy.py

      - name: Check embedded JavaScript parity
        run: python tools/check_parity.py

      - name: Run parity checker regression tests
        run: python tests/check_parity.test.py
