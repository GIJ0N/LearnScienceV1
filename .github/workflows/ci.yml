name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test adaptive tutoring cycle and durable decisions
        run: |
          node tests/adaptive_cycle.test.js
          python tests/adaptive_cycle.test.py

      - name: Run placement diagnostic tests
        run: |
          node tests/placement.test.js
          node tests/qa_round1.test.js
          node tests/content_trust.test.js
          python tests/content_trust_backend.test.py
          node tests/error_hunt.test.js
          python tests/error_hunt_backend.test.py
          node tests/teach_beto.test.js
          python tests/teach_beto_backend.test.py
          node tests/real_world_challenges.test.js
          python tests/real_world_challenges_backend.test.py
          node tests/qa_round2.test.js
          python tests/qa_round2_backend.test.py
          node tests/qa_round3.test.js
          python tests/qa_round3_backend.test.py
          node tests/qa_round4.test.js
          python tests/qa_round4_backend.test.py
          node tests/usage_report.test.js
          python tests/reported_items_backend.test.py
          node tests/reported_items.test.js
          python tests/local_confirmation_backend.test.py
          node tests/local_confirmation.test.js
          python tests/challenge_photos_backend.test.py
          python tests/choice_balance_backend.test.py
          python tests/private_network_access.test.py
          python tests/usage_telemetry.test.py
          node tests/challenge_photos.test.js
          node tests/qa_round5.test.js
          node tests/qa_round6.test.js
          python tests/placement_backend.test.py
      - name: Run step lesson tests
        run: |
          node tests/step_lessons.test.js
          python tests/step_lessons_backend.test.py
      - name: Run spaced practice tests
        run: |
          node tests/spaced_practice.test.js
          python tests/spaced_practice_backend.test.py
      - name: Run knowledge graph tests
        run: |
          node tests/knowledge_graph.test.js
          python tests/knowledge_graph_backend.test.py
      - name: Run expert panel tests
        run: node tests/expert_panel.test.js
      - name: Run area map tests
        run: |
          node tests/map_areas.test.js
          python tests/map_areas_backend.test.py
      - name: Run prompt quality tests
        run: |
          python tests/prompt_quality.test.py
          python tests/prompt_bench.test.py
      - name: Run LLM provider tests
        run: python tests/llm_provider.test.py
      - name: Run learner signal tests
        run: |
          node tests/learner_signals.test.js
          python tests/learner_signals_backend.test.py
      - name: Run evidence policy tests
        run: node tests/evidence_policy.test.js

      - name: Test read-only evidence map
        run: |
          node tests/evidence_map.test.js
          python tests/visual_demo_seed.test.py
          node tests/goal_relations.test.js
          python tests/goal_relations_persistence.test.py

      - name: Run evidence sufficiency and confirmation flow tests
        run: node tests/evidence_sufficiency.test.js

      - name: Run active confirmation endpoint and persistence tests
        run: python tests/evidence_confirmation.test.py

      - name: Test evidence-aware lesson adaptation
        run: python tests/adaptive_lesson.test.py

      - name: Run reachable dimension integration tests
        run: python tests/reachable_dimensions.test.py

      - name: Run delayed review frontend tests
        run: node tests/delayed_review.test.js

      - name: Run delayed review backend contract tests
        run: python tests/delayed_review_backend.test.py

      - name: Run durable memory tests
        run: python tests/durable_memory.test.py

      - name: Run durable frontend tests
        run: node tests/durable_memory_frontend.test.js

      - name: Run microtutoring repair episode tests
        run: node tests/microtutoring_repair_episode.test.js

      - name: Run repair teaching frontend tests
        run: node tests/repair_teaching_v2.test.js

      - name: Run repair teaching backend tests
        run: python tests/repair_teaching_backend.test.py

      - name: Run repair diagnosis recovery tests
        run: |
          node tests/repair_diagnosis_recovery.test.js
          python tests/repair_diagnosis_recovery_backend.test.py

      - name: Run criterion assessment v1 tests
        run: |
          python tests/criterion_assessment.test.py
          python tests/criterion_durability.test.py
          python tests/criterion_server_lock.test.py
          node tests/criterion_assessment_frontend.test.js

      - name: Run controlled repair acceptance tests
        run: |
          node tests/repair_acceptance_controlled.test.js
          python tests/repair_persistence_acceptance.test.py
          python tests/repair_visual_demo.test.py

      - name: Test bounded real acceptance harness offline
        run: python tests/accept_joint_candidate.test.py

      - name: Test graded hints
        run: |
          node tests/graded_hints.test.js
          python tests/graded_hints_backend.test.py

      - name: Check app.js syntax
        run: node --check app.js

      - name: Test evaluator and map integrity with offline benchmark
        run: |
          python tests/tutor_integrity.test.py
          python tests/criterion_contract_immutability.test.py
          node tests/criterion_checkpoint.test.js
          python tools/criterion_benchmark.py
          python tests/controlled_demo.test.py

      - name: Run the legacy app self-test
        run: python app_legacy.py --self-test

      - name: Compile the legacy app
        run: python -m py_compile app_legacy.py

      - name: Check embedded JavaScript parity
        run: python tools/check_parity.py

      - name: Run parity checker regression tests
        run: python tests/check_parity.test.py
